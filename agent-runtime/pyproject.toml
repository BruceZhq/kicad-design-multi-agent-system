[project]
name = "ratsnest"
version = "0.1.0"
description = "Auto-evolving multi-agent KiCad design review & repair runtime"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cluster = ["kafka-python>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# system %TEMP%\pytest-of-* has denied ACLs on this machine -> keep tmp in-repo
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratsnest*"]

[tool.setuptools.package-data]
"ratsnest.catalogs" = ["*.yaml"]
