schema_version: ratsnest.stage3-benchmark.v1
catalog_version: stage3.1.2

goldens:
  - id: ldo_5v_to_3v3_50ma
    spec:
      project_name: golden_ldo
      input_voltage: 5.0
      output_voltage: 3.3
      output_current_a: 0.05
      led: red
      topology: auto
      ambient_temperature_c: 25.0
      max_output_ripple_mv: 50.0
      requirement_text: 5V to 3.3V 50mA supply with red LED
    expected_topology: adjustable_ldo
    required_gates: [catalog, bom, erc, drc, spice, thermal, emc]

  - id: buck_12v_to_5v_500ma
    spec:
      project_name: golden_buck
      input_voltage: 12.0
      output_voltage: 5.0
      output_current_a: 0.5
      led: red
      topology: buck
      ambient_temperature_c: 25.0
      max_output_ripple_mv: 100.0
      requirement_text: 12V to 5V 500mA buck supply with red LED
    expected_topology: asynchronous_buck
    required_gates: [catalog, bom, erc, drc, spice, thermal, emc]

seeded_defects:
  - id: unsupported_boost_topology
    owner: planning
    mutation: requirement_requests_boost
  - id: wrong_feedback_divider
    owner: catalog
    mutation: change_r2_value
  - id: missing_or_untrusted_mpn
    owner: catalog
    mutation: clear_u1_mpn
  - id: underrated_power_part
    owner: planning
    mutation: exceed_family_current_envelope
  - id: schematic_erc_fault
    owner: erc
    mutation: erc_report_contains_error
  - id: pcb_short_or_unrouted
    owner: drc
    mutation: drc_report_contains_violation
  - id: thermal_overload
    owner: thermal
    mutation: junction_exceeds_design_limit
  - id: emc_power_loop
    owner: emc
    mutation: long_switch_node_and_remote_decoupling
