# cluster profile: Postgres + Kafka (docker-compose / k8s deployment)
spring.datasource.url=${RATSNEST_DB_URL:jdbc:postgresql://postgres:5432/ratsnest}
spring.datasource.username=${RATSNEST_DB_USER:ratsnest}
spring.datasource.password=${RATSNEST_DB_PASSWORD:ratsnest}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=${RATSNEST_KAFKA:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# dispatch through Kafka instead of a local subprocess
ratsnest.dispatch=kafka

# enterprise defaults: auth ON in cluster mode
ratsnest.security.mode=${RATSNEST_SECURITY_MODE:jwt}
ratsnest.topic.run-requests=ratsnest.run-requests
ratsnest.topic.atdp-events=ratsnest.atdp-events
