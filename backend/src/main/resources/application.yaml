spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: ratsnest-control-plane
  datasource:
    url: ${RATSNEST_DB_URL}
    username: ${RATSNEST_DB_USER}
    password: ${RATSNEST_DB_PASSWORD}
  flyway:
    clean-disabled: true
    default-schema: control_plane
    enabled: false
    schemas: control_plane
    validate-on-migrate: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${RATSNEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${RATSNEST_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${RATSNEST_KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${RATSNEST_KAFKA_SASL_JAAS_CONFIG:}
      ssl.endpoint.identification.algorithm: ${RATSNEST_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:HTTPS}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RATSNEST_OIDC_ISSUER_URI:}
          jwk-set-uri: ${RATSNEST_OIDC_JWK_SET_URI:}
          audiences:
            - ${RATSNEST_OIDC_AUDIENCE:}
          principal-claim-name: sub
  threads:
    virtual:
      enabled: true

ratsnest:
  artifacts:
    bucket: ${RATSNEST_ARTIFACT_BUCKET:}
    region: ${RATSNEST_ARTIFACT_REGION:us-east-1}
    internal-endpoint: ${RATSNEST_ARTIFACT_INTERNAL_ENDPOINT:${RATSNEST_ARTIFACT_ENDPOINT:}}
    endpoint: ${RATSNEST_ARTIFACT_ENDPOINT:}
    path-style: ${RATSNEST_ARTIFACT_PATH_STYLE:true}
    download-ttl: ${RATSNEST_ARTIFACT_DOWNLOAD_TTL:5m}
  agent-runtime:
    base-url: ${RATSNEST_AGENT_RUNTIME_URL:}
    canary-base-url: ${RATSNEST_AGENT_RUNTIME_CANARY_URL:}
    transport: ${RATSNEST_AGENT_RUNTIME_TRANSPORT:http}
    grpc-target: ${RATSNEST_AGENT_RUNTIME_GRPC_TARGET:}
    grpc-plaintext: ${RATSNEST_AGENT_RUNTIME_GRPC_PLAINTEXT:false}
    canary-grpc-target: ${RATSNEST_AGENT_RUNTIME_CANARY_GRPC_TARGET:}
    canary-grpc-plaintext: ${RATSNEST_AGENT_RUNTIME_CANARY_GRPC_PLAINTEXT:false}
    signing-secret: ${RATSNEST_INTERNAL_SIGNING_SECRET:}
  harness:
    version-id: ${RATSNEST_HARNESS_VERSION_ID:legacy-baseline}
    channel: ${RATSNEST_HARNESS_CHANNEL:stable}
    rollout-id: ${RATSNEST_HARNESS_ROLLOUT_ID:production}
    routing-secret: ${RATSNEST_HARNESS_ROUTING_SECRET:${RATSNEST_INTERNAL_SIGNING_SECRET:}}
  evolution:
    fingerprint-secret: ${RATSNEST_EVOLUTION_FINGERPRINT_SECRET:${RATSNEST_INTERNAL_SIGNING_SECRET:}}
    optimization-suite-digest: ${RATSNEST_EVOLUTION_OPTIMIZATION_SUITE_DIGEST:}
    holdout-suite-digest: ${RATSNEST_EVOLUTION_HOLDOUT_SUITE_DIGEST:}
    adversarial-suite-digest: ${RATSNEST_EVOLUTION_ADVERSARIAL_SUITE_DIGEST:}
    required-executor-mode: ${RATSNEST_EVOLUTION_REQUIRED_EXECUTOR_MODE:kubernetes_job}
  database:
    verify-isolation: true
  run-outbox:
    enabled: ${RATSNEST_RUN_OUTBOX_ENABLED:false}
    topic: ${RATSNEST_RUN_OUTBOX_TOPIC:ratsnest.runs.v1}
    batch-size: ${RATSNEST_RUN_OUTBOX_BATCH_SIZE:100}
    poll-delay: ${RATSNEST_RUN_OUTBOX_POLL_DELAY:1s}
    send-timeout: ${RATSNEST_RUN_OUTBOX_SEND_TIMEOUT:10s}
  run-reconciliation:
    enabled: ${RATSNEST_RUN_RECONCILIATION_ENABLED:false}
    batch-size: ${RATSNEST_RUN_RECONCILIATION_BATCH_SIZE:10}
    poll-delay: ${RATSNEST_RUN_RECONCILIATION_POLL_DELAY:5s}
    active-delay: ${RATSNEST_RUN_RECONCILIATION_ACTIVE_DELAY:15s}
    time-budget: ${RATSNEST_RUN_RECONCILIATION_TIME_BUDGET:30s}
    attempt-timeout: ${RATSNEST_RUN_RECONCILIATION_ATTEMPT_TIMEOUT:20s}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
