server.port=8080
spring.application.name=ratsnest-control-plane

# H2 file database (Postgres arrives with the compose/k8s deployment)
spring.datasource.url=jdbc:h2:file:./data/ratsnest;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=true

# Agent runtime dispatch (dev profile: local process).
# Override via env RATSNEST_PYTHON_EXE / RATSNEST_AGENT_RUNTIME_DIR in docker.
ratsnest.python-exe=${RATSNEST_PYTHON_EXE:.venv/Scripts/python.exe}
ratsnest.agent-runtime-dir=${RATSNEST_AGENT_RUNTIME_DIR:agent-runtime}
ratsnest.self-url=${RATSNEST_SELF_URL:http://localhost:8080}

# security: open (dev, frontend needs no token) | jwt (enterprise)
ratsnest.security.mode=${RATSNEST_SECURITY_MODE:open}
ratsnest.security.jwt-secret=${RATSNEST_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
ratsnest.security.service-token=${RATSNEST_SERVICE_TOKEN:}
ratsnest.security.token-hours=24
ratsnest.security.cookie-secure=${RATSNEST_COOKIE_SECURE:false}
ratsnest.ratelimit.per-second=${RATSNEST_RATE_PER_SECOND:25}
ratsnest.ratelimit.burst=${RATSNEST_RATE_BURST:50}
# memory (single node) | redis (shared across scaled backends)
ratsnest.ratelimit.mode=${RATSNEST_RATELIMIT_MODE:memory}
spring.data.redis.host=${RATSNEST_REDIS_HOST:localhost}
spring.data.redis.port=${RATSNEST_REDIS_PORT:6379}
ratsnest.dispatch.pool-size=4
ratsnest.dispatch.queue-capacity=100

# observability
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=never

# db pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

# Durable run artifacts. The filesystem implementation is used locally and
# behind the backend-data volume; ArtifactStore is the boundary for S3/MinIO.
ratsnest.artifacts.root=${RATSNEST_ARTIFACT_ROOT:./data/artifacts}
ratsnest.artifacts.max-bytes=${RATSNEST_ARTIFACT_MAX_BYTES:268435456}

# local profile: dispatch = subprocess; kafka disabled
ratsnest.dispatch=local
ratsnest.topic.run-requests=ratsnest.run-requests
ratsnest.topic.atdp-events=ratsnest.atdp-events
spring.kafka.bootstrap-servers=${RATSNEST_KAFKA:localhost:9092}
# don't fail health/startup when no broker exists in local mode
spring.kafka.admin.fail-fast=false
