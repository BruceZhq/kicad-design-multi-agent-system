apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-egress, namespace: ratsnest }
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-oidc-proxy-egress, namespace: ratsnest }
spec:
  podSelector: { matchLabels: { app: ratsnest-oidc-proxy } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: ratsnest-web } }
      ports: [{ protocol: TCP, port: 3000 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-agent-runtime-egress, namespace: ratsnest }
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ratsnest-agent-service, ratsnest-temporal-worker]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ratsnest-data }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 7233 }
        - { protocol: TCP, port: 9093 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-kafka-audit-relay-egress, namespace: ratsnest }
spec:
  podSelector: { matchLabels: { app: ratsnest-kafka-audit-relay } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ratsnest-data }
      ports: [{ protocol: TCP, port: 6379 }, { protocol: TCP, port: 9093 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
