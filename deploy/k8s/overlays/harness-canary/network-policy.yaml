apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-to-agent-service-canary
  namespace: ratsnest
spec:
  podSelector: { matchLabels: { app: ratsnest-agent-service-canary } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ratsnest-control-plane } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-to-agent-service-canary-egress
  namespace: ratsnest
spec:
  podSelector: { matchLabels: { app: ratsnest-control-plane } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: ratsnest-agent-service-canary } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9090 }
