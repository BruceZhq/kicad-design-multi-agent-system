apiVersion: v1
kind: ConfigMap
metadata:
  name: ratsnest-runtime-config
  namespace: ratsnest
data:
  MODE: production
  HOST: 0.0.0.0
  PORT: "8080"
  DATABASE_TYPE: postgres
  POSTGRES_HOST: postgres-rw.ratsnest-data.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: agent_service
  LONG_TERM_MEMORY_ENABLED: "true"
  LONG_TERM_MEMORY_EMBEDDING_DIMENSIONS: "384"
  LONG_TERM_MEMORY_RETRIEVAL_LIMIT: "8"
  LONG_TERM_MEMORY_RECENCY_HALF_LIFE_DAYS: "30"
  LONG_TERM_MEMORY_MIN_SCORE: "0.22"
  LONG_TERM_MEMORY_RETENTION_DAYS: "365"
  RUN_TIMEOUT_SECONDS: "36000"
  RUN_REGISTRY_BACKEND: redis
  REDIS_KEY_PREFIX: ratsnest:cell-01
  RATSNESTPRO_LLM_STREAM_ENABLED: "true"
  RATSNESTPRO_LLM_STREAM_MAXLEN: "2048"
  RATSNESTPRO_LLM_STREAM_TTL_SECONDS: "86400"
  RATSNESTPRO_LLM_STREAM_SOCKET_TIMEOUT_SECONDS: "0.25"
  RATSNESTPRO_TEMPORAL_ENABLED: "true"
  TEMPORAL_ADDRESS: temporal-frontend.ratsnest-data.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: ratsnest
  RATSNESTPRO_TEMPORAL_TASK_QUEUE: ratsnest-hardware-cell-01
  RATSNESTPRO_TEMPORAL_WORKER_CONCURRENCY: "1"
  RATSNESTPRO_TEMPORAL_WORKFLOW_TIMEOUT_SECONDS: "36000"
  RATSNESTPRO_AHE_MAX_WALL_CLOCK_MINUTES: "600"
  RATSNESTPRO_WORKSPACE_ROOT: /data/ratsnestpro
  # Set this to the in-cluster Agentic RAG Service URL to enable it. Keep the
  # bearer token only in ratsnest-runtime-secrets.
  RATSNEST_KNOWLEDGE_GATEWAY_URL: ""
  RATSNEST_KNOWLEDGE_GATEWAY_TIMEOUT_SECONDS: "8"
  RATSNEST_ARTIFACT_BACKEND: s3
  RATSNEST_ARTIFACT_BUCKET: ratsnest-artifacts-cell-01
  RATSNEST_ARTIFACT_ENDPOINT: https://s3.example.com
  RATSNEST_ARTIFACT_REGION: us-east-1
  RATSNEST_ARTIFACT_PATH_STYLE: "false"
  RATSNEST_ARTIFACT_SSE: AES256
  RATSNEST_ARTIFACT_DOWNLOAD_TTL: 5m
  RATSNEST_INTERNAL_GRPC_ENABLED: "false"
  RATSNEST_INTERNAL_GRPC_HOST: 0.0.0.0
  RATSNEST_INTERNAL_GRPC_PORT: "9090"
  KAFKA_AUDIT_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka-bootstrap.ratsnest-data.svc.cluster.local:9093
  KAFKA_AUDIT_TOPIC: ratsnest.audit.v1
  KAFKA_AUDIT_CONSUMER_GROUP: ratsnest-audit-cell-01
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  REQUIRE_AUTH_IN_PRODUCTION: "true"
  CONTROL_PLANE_URL: http://ratsnest-control-plane:8080
  WEB_TRUST_OIDC_PROXY_ACCESS_TOKEN: "true"
  RATSNEST_AGENT_RUNTIME_URL: http://ratsnest-agent-service:8080
  RATSNEST_AGENT_RUNTIME_CANARY_URL: http://ratsnest-agent-service-canary:8080
  RATSNEST_AGENT_RUNTIME_TRANSPORT: http
  RATSNEST_AGENT_RUNTIME_GRPC_TARGET: ratsnest-agent-service:9090
  RATSNEST_AGENT_RUNTIME_GRPC_PLAINTEXT: "true"
  RATSNEST_AGENT_RUNTIME_CANARY_GRPC_TARGET: ratsnest-agent-service-canary:9090
  RATSNEST_AGENT_RUNTIME_CANARY_GRPC_PLAINTEXT: "true"
  RATSNEST_KAFKA_BOOTSTRAP_SERVERS: kafka-bootstrap.ratsnest-data.svc.cluster.local:9093
  RATSNEST_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  RATSNEST_KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  RATSNEST_KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS
  RATSNEST_RUN_OUTBOX_ENABLED: "false"
  RATSNEST_RUN_OUTBOX_TOPIC: ratsnest.runs.v1
  RATSNEST_RUN_RECONCILIATION_ENABLED: "false"
  # Content-addressed suite identities. Release automation must verify these
  # against the exact checked-out suite manifests before rollout.
  RATSNEST_EVOLUTION_OPTIMIZATION_SUITE_DIGEST: "72045680ee4a669af184ecd6a89469b7afcfaaa555831aa8b9728b3380877163"
  RATSNEST_EVOLUTION_HOLDOUT_SUITE_DIGEST: "9d0de693c854ecb54ba704e624d2a5e9e2b1f0af9e27b8cfbb1d177562568751"
  RATSNEST_EVOLUTION_ADVERSARIAL_SUITE_DIGEST: "94f49fa90854cc5b7cee49469346a372e73b6139ddecc8a2597008d4a6bfae58"
  RATSNEST_EVOLUTION_REQUIRED_EXECUTOR_MODE: kubernetes_job
  RATSNEST_EVOLUTION_TEMPORAL_TASK_QUEUE: ratsnest-evolution-production
  RATSNEST_DB_URL: jdbc:postgresql://postgres-rw.ratsnest-data.svc.cluster.local:5432/agent_service
  RATSNEST_OIDC_ISSUER_URI: https://identity.example.com/realms/ratsnest
  RATSNEST_OIDC_JWK_SET_URI: https://identity.example.com/realms/ratsnest/protocol/openid-connect/certs
  RATSNEST_OIDC_AUDIENCE: ratsnest-api
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://identity.example.com/realms/ratsnest
  CELL_ID: cell-01
  REGION_ID: primary
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ratsnest-workspaces
  namespace: ratsnest
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 200Gi
