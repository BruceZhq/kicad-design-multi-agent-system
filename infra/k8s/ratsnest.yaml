# RatsNest on Kubernetes — starting manifests (NOT yet tested against a real
# cluster; validated for syntax only). Push the two images built by the
# Dockerfiles in ../docker to your registry first and adjust `image:`.
apiVersion: v1
kind: Namespace
metadata:
  name: ratsnest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratsnest-backend
  namespace: ratsnest
spec:
  replicas: 1
  selector:
    matchLabels: { app: ratsnest-backend }
  template:
    metadata:
      labels: { app: ratsnest-backend }
    spec:
      containers:
        - name: backend
          image: ratsnest-backend:0.1.0   # <- push + point at your registry
          ports:
            - containerPort: 8080
          env:
            - name: RATSNEST_SELF_URL
              value: http://ratsnest-backend.ratsnest.svc.cluster.local:8080
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ratsnest-backend
  namespace: ratsnest
spec:
  selector: { app: ratsnest-backend }
  ports:
    - port: 8080
      targetPort: 8080
---
# One-shot repair run as a Job (the queue-based worker deployment is Phase 5)
apiVersion: batch/v1
kind: Job
metadata:
  name: ratsnest-fix-demo
  namespace: ratsnest
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: runtime
          image: ratsnest-runtime:0.1.0   # <- push + point at your registry
          command: ["sh", "-c"]
          args:
            - python -m ratsnest seed-defects &&
              python -m ratsnest fix /repo/RatsNest/benchmarks/seeded/demo_board_defective --no-erc
          env:
            - name: RATSNEST_CONTROL_PLANE_URL
              value: http://ratsnest-backend.ratsnest.svc.cluster.local:8080
