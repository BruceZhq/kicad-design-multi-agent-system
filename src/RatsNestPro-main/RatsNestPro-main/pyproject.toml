[project]
name = "ratsnestpro"
version = "0.1.0"
description = "An independent, EricAI-driven PCB design & review agent (ATmega328 family, in-family parameterization, two-tier knowledge + retrieval)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# EricAI is installed from Ericsson's internal artifactory index; keep it
# optional so the deterministic core installs and tests run fully offline.
#   pip install --index https://arm.sero.gic.ericsson.se/artifactory/api/pypi/proj-swtech-pypi-local/simple ericai
llm = ["ericai"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ratsnestpro = "ratsnestpro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratsnestpro"]

[tool.pytest.ini_options]
markers = [
    "real_kicad: tests that require a real KiCad 10 CLI install (opt-in)",
    "real_ericai: tests that require a reachable EricAI gateway (opt-in)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored upstream code is kept verbatim; the routing worker targets KiCad's
# own python interpreter (pcbnew) — neither is linted here.
extend-exclude = ["src/ratsnestpro/eda/vendor", "src/ratsnestpro/eda/_route_worker.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["ratsnestpro"]
mypy_path = "src"
ignore_missing_imports = true
# Vendored third-party code is checked loosely; our own code is strict.
[[tool.mypy.overrides]]
module = "ratsnestpro.eda.vendor.*"
ignore_errors = true

# Routing worker runs under KiCad's own python (pcbnew); not analysed here.
[[tool.mypy.overrides]]
module = "ratsnestpro.eda._route_worker"
ignore_errors = true
